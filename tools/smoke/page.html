<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
  window.__selection = { selected: 1, locked: 0, text: 1 };
  window.__errors = [];
  addEventListener("error", e => window.__errors.push(String(e.message)));
  addEventListener("unhandledrejection", e =>
      window.__errors.push("rejection: " + ((e.reason && e.reason.message) || e.reason)));
</script>
<script type="importmap">
{ "imports": { "https://new.express.adobe.com/static/add-on-sdk/sdk.js": "/tools/smoke/mock-sdk.js" } }
</script>
<script type="module" src="/dist/index.js"></script>
</head>
<body style="width:321px;margin:0">
<div id="root"></div>
<pre id="result">pending</pre>
<script>
(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const button = label => [...document.querySelectorAll("button")].find(b => b.textContent.trim() === label);
    const status = () => (document.querySelector(".status") || {}).textContent?.trim() || "";
    const out = { steps: [], errors: [], called: [] };

    const press = async label => {
        const b = button(label);
        if (!b) { out.steps.push([label, "BUTTON NOT FOUND"]); return; }
        b.click();
        await sleep(900);
        out.steps.push([label, status()]);
    };
    const openTab = async label => { button(label)?.click(); await sleep(400); };

    let mounted = null;
    for (let i = 0; i < 60 && !mounted; i++) { await sleep(100); mounted = button("Colors"); }
    out.mounted = !!mounted;

    // The panel reads its build id from the sandbox on startup and warns if they differ.
    window.__BUILD = (document.querySelector(".notice") ? "mismatch" : undefined);

    await press("Primary");
    await press("Add palette to page");
    await openTab("Fonts");
    await press("Apply to selection");
    await press("Use selected text's font");
    await press("Scan fonts on this page");
    await press("Fix 1 off-brand font");
    await openTab("Audit");
    await press("Scan colors on this page");
    await press("Fix 1 off-brand color");

    // Adobe's review found that choosing a .tiff left a broken image in the preview
    // instead of saying the format is not supported, so the upload screen is driven with
    // a real file input: a rejected file must leave no preview behind, and an accepted
    // one must still be previewed -- a check that only refuses would pass if the panel
    // started refusing everything. Last, because reaching it clears the brand kit.
    const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    // Smallest valid 1x1 PNG, so the preview has something it can actually decode.
    const PNG = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==";

    const choose = async (label, file) => {
        if (!document.querySelector('input[type="file"]')) {
            await openTab("Colors");
            button("Analyze a different logo")?.click();
            await sleep(500);
        }
        const input = document.querySelector('input[type="file"]');
        if (!input) { out.steps.push([label, "FILE INPUT NOT FOUND"]); return; }
        const data = new DataTransfer();
        data.items.add(file);
        input.files = data.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await sleep(600);
        const preview = document.querySelector(".logoCard img");
        out.steps.push([label, preview ? `preview shown: ${status() || "(no message)"}` : status()]);
    };

    await choose("Reject a TIFF", new File([bytes("SUkqAA==")], "logo.tiff", { type: "image/tiff" }));
    await choose("Accept a PNG", new File([bytes(PNG)], "logo.png", { type: "image/png" }));

    out.errors = window.__errors;
    out.called = [...new Set(window.__called)];
    document.getElementById("result").textContent = "@@" + JSON.stringify(out) + "@@";
})();
</script>
</body>
</html>
